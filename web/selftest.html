<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-test | Frankenstein's Lovecraftian Village</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #1f2b2d; }
    tr.ok td:last-child, p.ok { color: var(--moss); }
    tr.bad td, p.bad { color: var(--blood); }
  </style>
</head>
<body>
  <main>
    <h1>Parity self-test</h1>
    <p class="tag">Runs the JavaScript Core in your browser against golden vectors emitted by the C# test suite. No network, no dependencies.</p>
    <p id="summary" role="status" aria-live="polite">Running checks...</p>
    <noscript><p>This page needs JavaScript. Serve the folder over HTTP, for example: python3 -m http.server -d web</p></noscript>
    <table>
      <caption class="sr-only">Parity check results</caption>
      <thead><tr><th scope="col">Group</th><th scope="col">Check</th><th scope="col">Result</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <footer><a href="index.html">Back to the village</a></footer>
  </main>
  <script type="module" src="src/selftest-page.js"></script>
</body>
</html>
